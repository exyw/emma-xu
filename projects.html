<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Projects | Emma Xu</title>
    <script src="projects-config.js"></script>
    <script>
      try {
        const projectId = decodeURIComponent(location.hash.slice(1));
        if (window.projectConfig.projects.some((project) => project.id === projectId)) {
          document.documentElement.classList.add("projects-initial-detail");
        }
      } catch (_) { /* An invalid hash opens the overview. */ }
    </script>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="projects.css">
  </head>
  <body class="projects-page portrait-overview-page">
    <nav class="site-nav site-nav--portrait is-ready" aria-label="Main navigation">
      <div class="page-menu">
        <a class="selected" href="projects.html" aria-current="page">Projects</a>
        <a href="index.html">Emma Xu</a>
        <a href="who-i-am.html">Who I am</a>
      </div>
      <a class="contact-link" href="contact.html">Contact</a>
    </nav>

    <main class="projects-main swipe-surface">
      <h1 class="visually-hidden projects-overview-title">Projects</h1>
      <section class="projects-experience" aria-label="Projects">
        <header class="projects-heading" hidden>
          <button class="projects-back" type="button">← All projects</button>
          <div>
            <h1 class="projects-title" tabindex="-1"></h1>
            <p class="projects-meta projects-meta--with-original" hidden><span class="projects-meta__text"></span><button class="projects-original-toggle" type="button">View Original</button></p>
          </div>
        </header>
        <nav class="projects-detail-header" aria-label="Project detail navigation">
          <button class="projects-back projects-detail-back" type="button">← All projects</button>
          <a class="projects-detail-contact" href="contact.html">Contact</a>
        </nav>
        <div class="projects-stage" data-project-stage role="group" aria-label="Select a project from the ASCII portrait"></div>
        <div class="projects-copy" hidden></div>
        <nav class="project-pagination" aria-label="Project navigation" hidden>
          <button class="project-previous" type="button"></button>
          <span class="project-position"></span>
          <button class="project-next" type="button"></button>
        </nav>
        <p class="visually-hidden project-announcement" role="status" aria-live="polite"></p>
        <nav class="overview-navigation" aria-label="Portrait views">
          <a href="who-i-am.html"><span>Who I am</span><span aria-hidden="true">→</span></a>
        </nav>
      </section>
    </main>

    <script src="experience.js"></script>
    <script src="navigation.js"></script>
    <script src="projects-morph-data.js"></script>
    <script src="projects.js"></script>
  </body>
</html>
