<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Emma Xu</title>
    <script src="projects-config.js"></script>
    <script>
      try {
        const projectId = decodeURIComponent(location.hash.slice(1));
        if (window.projectConfig.projects.some((project) => project.id === projectId)) {
          document.documentElement.classList.add("projects-initial-detail");
        }
      } catch (_) { /* An invalid hash opens the overview. */ }
    </script>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="projects.css">
  </head>
  <body class="projects-page">
    <nav class="site-nav site-nav--portrait is-ready" aria-label="Main navigation">
      <div class="page-menu">
        <a class="selected" href="projects.html" aria-current="page">Projects</a>
        <a href="index.html">Emma Xu</a>
        <a href="who-i-am.html">Who I am</a>
      </div>
      <a class="contact-link" href="contact.html">Contact</a>
    </nav>

    <main class="projects-main">
      <section class="projects-experience" aria-label="Projects">
        <header class="projects-heading" hidden>
          <button class="projects-back" type="button">← All projects</button>
          <div>
            <h1 class="projects-title" tabindex="-1"></h1>
            <p class="projects-meta" hidden><span class="projects-meta__text"></span></p>
          </div>
        </header>
        <div class="projects-stage" data-project-stage role="group" aria-label="Select a project from the ASCII portrait"></div>
        <div class="projects-copy" hidden></div>
      </section>
    </main>

    <script src="navigation.js"></script>
    <script src="projects-morph-data.js"></script>
    <script src="projects.js"></script>
  </body>
</html>
