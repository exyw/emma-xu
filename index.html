<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emma Xu</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        background: radial-gradient(circle at center, #EDE4D3 0%, #B6A58D 100%);
        font-family: courier, monospace;
      }

      @property --cursor-x {
        syntax: "<length-percentage>";
        inherits: false;
        initial-value: 50%;
      }

      @property --cursor-y {
        syntax: "<length-percentage>";
        inherits: false;
        initial-value: 50%;
      }

      .prelude {
        --reveal-radius: clamp(80px, 6vw, 100px);
        --half-nav-gap: clamp(12px, 1.5vw, 18px);
        --cursor-x: 50%;
        --cursor-y: 50%;
        --reveal-radius: 100px;
        position: fixed;
        inset: 0;
        z-index: 2;
        cursor: default;
        transition: opacity 350ms ease;
      }

      .prelude.is-dismissed {
        opacity: 0;
        pointer-events: none;
      }

      .prelude-title {
        position: absolute;
        top: 50%;
        left: calc(50% - var(--half-nav-gap));
        pointer-events: none;
        font-size: 20px;
        font-weight: bold;
        transform: translate(-100%, -50%);
        white-space: nowrap;
      }

      .prelude-mask {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        transition: none;
        background: radial-gradient(
            circle var(--reveal-radius) at var(--cursor-x) var(--cursor-y),
            transparent 0%,
            transparent 55%,
            rgb(0 0 0 / 18%) 67%,
            rgb(0 0 0 / 48%) 80%,
            rgb(0 0 0 / 80%) 91%,
            #000 100%
        );
        --cursor-x:30vh;
        --cursor-y:40vw;
      }

      .site-nav {
        visibility: hidden;
      }

      .site-nav.is-ready {
        visibility: visible;
      }

      .site-nav {
        --half-nav-gap: clamp(12px, 1.5vw, 18px);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translateY(-50%);
        white-space: nowrap;
      }

      .site-nav a {
        color: inherit;
        display: block;
        font-size: 20px;
        text-decoration: none;
      }

      .site-nav a.selected {
        font-weight: bold;
      }

      .page-menu {
        position: absolute;
        top: 50%;
        right: var(--half-nav-gap);
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        text-align: right;
        transform: translateY(-50%);
      }

      .contact-link {
        position: absolute;
        top: 50%;
        left: var(--half-nav-gap);
        text-align: left;
        transform: translateY(-50%);
      }

      .site-nav .extra-link {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
        transition:
          opacity 200ms ease,
          transform 200ms ease,
          visibility 0s linear 200ms;
      }

      .site-nav .extra-link:last-child {
        transform: translateY(-8px);
      }

      .site-nav:hover .extra-link,
      .site-nav:focus-within .extra-link {
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
        transition-delay: 0s;
      }

      .site-nav a.is-typing::after {
        content: ""; /* Creates the pseudo-element without adding text. */
        display: inline-block; /* Lets the caret have its own width and height. */
        width: 0.6ch; /* Makes the caret about 60% as wide as a character. */
        height: 0.8em; /* Makes the caret slightly shorter than the text. */
        margin-left: 0.15ch; /* Adds a small gap after the typed label. */
        vertical-align: -0.15em; /* Moves the caret down to align with the text. */
        background: currentColor; /* Uses the link's current text color. */
        animation: cursor-blink 1000ms steps(1) infinite; /* Blinks forever in discrete steps. */
      }

      @keyframes cursor-blink {
        50% { /* At the halfway point, switch the caret off. */
          opacity: 0; /* Makes the caret invisible for the second half. */
        }
      }
    </style>
  </head>
  <body>
    <div class="prelude" aria-hidden="true">
      <div class="prelude-title">Emma Xu</div>
      <div class="prelude-mask"></div>
    </div>

    <nav class="site-nav" aria-label="Main navigation">
      <div class="page-menu">
        <a class="extra-link" href="#projects">Projects</a>
        <a class="selected" href="#home">Emma Xu</a>
        <a class="extra-link" href="#about">Who I am</a>
      </div>
      <a class="contact-link" href="#contact">Contact</a>
    </nav>

    <script>
        const prelude = document.querySelector(".prelude");
        const preludeMask = document.querySelector(".prelude-mask");
        const siteNav = document.querySelector(".site-nav");
        const prefersReducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
        );
        const mobileQuery = window.matchMedia(
        "(max-width: 640px), (hover: none)"
        );

        // Current position: where the spotlight is drawn now.
        let x = window.innerWidth * 0.3;
        let y = window.innerHeight * 0.4;   

        // Target position: where the spotlight is travelling.
        let targetX = x;
        let targetY = y;

        let automatic = !prefersReducedMotion.matches;
        let spotlightActive = true;
        let previousFrameTime = performance.now();
        let idleTimer;

        let heading = 0;
        const idleSpeed = 65; // Pixels per second
        const turnRate = 1.5; // Radians per second

        function displaySpotlight() {
        // Set these on the mask itself, where the gradient uses them.
        preludeMask.style.setProperty("--cursor-x", `${x}px`);
        preludeMask.style.setProperty("--cursor-y", `${y}px`);
        }

        function chooseTarget() {
        const horizontalMargin = Math.min(90, window.innerWidth * 0.18);
        const verticalMargin = Math.min(90, window.innerHeight * 0.18);

        targetX =
            horizontalMargin +
            Math.random() *
            Math.max(0, window.innerWidth - horizontalMargin * 2);

        targetY =
            verticalMargin +
            Math.random() *
            Math.max(0, window.innerHeight - verticalMargin * 2);
        }

        function resumeAutomaticMovement() {
        window.clearTimeout(idleTimer);

        idleTimer = window.setTimeout(() => {
            if (spotlightActive && !prefersReducedMotion.matches) {
            automatic = true;
            chooseTarget();
            }
        }, 2200);
        }

        function animateSpotlight(currentTime) {
        if (!spotlightActive) return;

        const deltaTime = Math.min(
            (currentTime - previousFrameTime) / 1000,
            0.05
        );
        previousFrameTime = currentTime;

        if (prefersReducedMotion.matches) {
            x = targetX;
            y = targetY;
        } else if (automatic) {
            // Pick another destination before reaching the current one.
            if (Math.hypot(targetX - x, targetY - y) < 90) {
                chooseTarget();
            }

            const desiredHeading = Math.atan2(targetY - y, targetX - x);

            // Find the shortest turn toward that destination.
            const angleDifference = Math.atan2(
                Math.sin(desiredHeading - heading),
                Math.cos(desiredHeading - heading)
            );

            // Limit how sharply the spotlight can turn in one frame.
            const maximumTurn = turnRate * deltaTime;
            heading += Math.max(
                -maximumTurn,
                Math.min(maximumTurn, angleDifference)
            );

            // Move the same distance per second, including while turning.
            x += Math.cos(heading) * idleSpeed * deltaTime;
            y += Math.sin(heading) * idleSpeed * deltaTime;
        } else {
            // Preserve the existing soft, delayed mouse follow.
            const easing = 1 - Math.exp(-5 * deltaTime);
            x += (targetX - x) * easing;
            y += (targetY - y) * easing;
        }

        displaySpotlight();
        window.requestAnimationFrame(animateSpotlight);
        }

        window.addEventListener("pointermove", (event) => {
        if (
            !spotlightActive ||
            event.pointerType === "touch" ||
            mobileQuery.matches
        ) {
            return;
        }

        automatic = false;
        targetX = event.clientX;
        targetY = event.clientY;
        resumeAutomaticMovement();
        });

        window.addEventListener("resize", () => {
        x = Math.max(0, Math.min(window.innerWidth, x));
        y = Math.max(0, Math.min(window.innerHeight, y));
        targetX = Math.max(0, Math.min(window.innerWidth, targetX));
        targetY = Math.max(0, Math.min(window.innerHeight, targetY));
        });

        function dismissPrelude() {
        if (!spotlightActive) return;

        spotlightActive = false;
        window.clearTimeout(idleTimer);
        prelude.classList.add("is-dismissed");

        window.setTimeout(() => {
            prelude.remove();
            siteNav.classList.add("is-ready");
        }, 350);
        }

        prelude.addEventListener("click", dismissPrelude);

        if (automatic) {
            chooseTarget();
            heading = Math.atan2(targetY - y, targetX - x);
        }
        displaySpotlight();
        window.requestAnimationFrame(animateSpotlight);

      // Runs the setup once for every navigation link.
      document.querySelectorAll(".site-nav a").forEach((link) => {
        // Saves the original link text before the script replaces it.
        const label = link.textContent.trim();
        // Creates a span that will display the gradually typed text.
        const text = document.createElement("span");
        // Measures the original link so the layout does not resize while typing.
        const linkWidth = link.getBoundingClientRect().width;
        // Stores the timer that schedules the next character.
        let typingTimer;
        // Stores the timer that starts the next complete typing loop.
        let cursorTimer;
        // Tracks whether the pointer is still over this link.
        let isHovered = false;
        let previousDelays = [];
        // Sets the shortest possible delay between typed characters in milliseconds.
        const minimumTypingDelay = 40;
        // Sets the longest possible delay between typed characters in milliseconds.
        const maximumTypingDelay = 300;
        // Sets the shortest pause before a new typing loop starts.
        const minimumLoopDelay = 250;
        // Sets the longest pause before a new typing loop starts.
        const maximumLoopDelay = 900;

        // Reserves the original width so the link does not move as text appears.
        link.style.width = `${linkWidth}px`;
        // Keeps the complete label available to screen readers.
        link.setAttribute("aria-label", label);
        // Removes the original text from the link's visible content.
        link.textContent = "";
        // Gives the visible text span its CSS class.
        text.className = "nav-link-text";
        // Prevents screen readers from reading the same label twice.
        text.setAttribute("aria-hidden", "true");
        // Shows the complete label until typing begins.
        text.textContent = label;
        // Places the visible text span inside the link.
        link.append(text);

        // Starts one complete typing cycle.
        function typeLabel() {
          // Leaves the label unchanged when reduced motion is enabled.
          if (prefersReducedMotion.matches) return;

          // Cancels any character timer from an earlier cycle.
          window.clearTimeout(typingTimer);
          // Cancels any pending restart from an earlier cycle.
          window.clearTimeout(cursorTimer);
          // Adds the class that displays and animates the block caret.
          link.classList.add("is-typing");
          // Clears the visible label so it can be typed from the beginning.
          text.textContent = "";
          // Starts counting at the first character.
          let characterIndex = 0;

          const currentDelays = [];

          // Types one more character, then schedules the next one.
          function typeNextCharacter() {
            // Displays the label from its first character through the current one.
            text.textContent = label.slice(0, characterIndex + 1);
            // Moves the character position forward by one.
            characterIndex += 1;

            // Checks whether the complete label has been typed.
            if (characterIndex === label.length) {
              previousDelays = currentDelays;
              // Only restart if the pointer is still over the link.
              if (isHovered) {
                // Chooses a new random pause for this loop.
                const loopDelay = minimumLoopDelay + Math.random() * (maximumLoopDelay - minimumLoopDelay);
                // Starts another typing cycle after that random pause.
                cursorTimer = window.setTimeout(typeLabel, loopDelay);
              }
              // Stops this cycle because there are no more characters to type.
              return;
            }

            // Chooses a new random delay for the next character.
            const delayIndex = characterIndex - 1;
            let typingDelay;

            do {
            typingDelay =
                minimumTypingDelay +
                Math.random() * (maximumTypingDelay - minimumTypingDelay);
            } while (
            previousDelays[delayIndex] !== undefined &&
            Math.abs(typingDelay - previousDelays[delayIndex]) < 90
            );

            currentDelays[delayIndex] = typingDelay;
            // Schedules the next character after the chosen delay.
            typingTimer = window.setTimeout(typeNextCharacter, typingDelay);
          }

          // Types the first character immediately.
          typeNextCharacter();
        }

        // Starts the animation when the pointer enters the link.
        link.addEventListener("mouseenter", () => {
          // Marks this link as actively hovered.
          isHovered = true;
          // Begins the first typing cycle.
          typeLabel();
        });
        // Stops the animation when the pointer leaves the link.
        link.addEventListener("mouseleave", () => {
          // Prevents the completed cycle from starting another loop.
          isHovered = false;
          // Cancels any character that was waiting to be typed.
          window.clearTimeout(typingTimer);
          // Cancels any waiting loop restart.
          window.clearTimeout(cursorTimer);
          // Removes the caret and its blinking animation.
          link.classList.remove("is-typing");
          // Restores the complete label when hovering ends.
          text.textContent = label;
        });
        // Starts typing when the link receives keyboard focus.
        link.addEventListener("focus", typeLabel);
      });
    </script>
  </body>
</html>
